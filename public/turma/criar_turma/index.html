<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="criar_turma.css">
  <title>NotaDez - Cadastro Turma</title>
  <script src="criar_turma.js"></script>
</head>
<body>
  <div class="instituicao-container">
    <h1 class="instituicao-title">Criar Turma aqui!</h1>

    <div class="instituicao-form">
      <label for="instituicao-nome" class="instituicao-label">id:</label>
      <input type="text" id="codigo_disciplina" class="instituicao-input" name="nome" required placeholder="Id da disciplina">
    </div>

    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Nome:</label>
      <input type="text" id="nome_turma" class="instituicao-input" name="sigla" required placeholder="Nome da turma">
    </div>

    <button type="button" class="instituicao-button" id="btn-cadastrar" onclick="criarTurma()">Criar</button>
    <button class="instituicao-button" id="logout" style="margin-top:15px; background: linear-gradient(135deg, #d61bff 0%, #5a0ad8 100%);" onclick="window.location.href='/dashboard/'">Sair</button>
  </div>
</body>
</html>

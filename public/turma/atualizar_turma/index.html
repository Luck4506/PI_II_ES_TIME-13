<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="atualizar_turma.css">
  <title>NotaDez - Atualizar nome turma</title>
  <script src="atualizar_turma.js"></script>
</head>
<body>
  <div class="instituicao-container">
    <h1 class="instituicao-title">Atualize o nome da turma aqui!</h1>

    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Id:</label>
      <input type="text" id="id_turma" class="instituicao-input" name="sigla" required placeholder="Id da turma">
    </div>
    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Nome:</label>
      <input type="text" id="nome_antigo" class="instituicao-input" name="sigla" required placeholder="Antigo nome da turma">
    </div>
    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Nome:</label>
      <input type="text" id="nome_novo" class="instituicao-input" name="sigla" required placeholder="Novo nome da turma">
    </div>

    <button type="button" class="instituicao-button" id="btn-atualizar" onclick="atualizarTurma()">Atualizar</button>
    <button class="instituicao-button" id="logout" style="margin-top:15px; background: linear-gradient(135deg, #d61bff 0%, #5a0ad8 100%);" onclick="window.location.href='/dashboard/'">Sair</button>
  </div>
</body>
</html>

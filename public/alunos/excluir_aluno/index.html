<!DOCTYPE html>
<html lang="pt-br">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="comp_3.css">
    <title>NotaDez - Excluir aluno</title>
    <link href="aluno_3.css" rel="stylesheet">
    </head>
    <body>
        <div class="card">

            <button id="btn-sair" onclick="window.location.href='/dashboard/'"><</button>

            <h1 id="title">Excluir Aluno</h1>

            <p class="aluno_subtitle">
            Digite o <strong>identificador (RA)</strong> de aluno que deseja remover.
            </p>

            <div class="aluno_form">
                <label for="aluno_ra" class="aluno_label">RA do Aluno</label>
                <input 
                    type="text"
                    id="aluno_ra" 
                    class="aluno_input" 
                    name="ra"
                    required
                    placeholder="Ex.: 25005651, 25008403, ..."
                    autocomplete="off"
                />
                <small class="aluno_help">
                    Este é o identificador único do aluno no sistema.
                </small>
            </div>

            <button type="button" class="aluno_button" id="btn_excluir" onclick="excluirAluno()">
            Excluir
            </button>

        </div>
        <script src="excluir_aluno.js"></script>
    </body>
</html>

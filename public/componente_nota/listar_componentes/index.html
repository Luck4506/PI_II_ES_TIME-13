<!-- Inicio do código HTML -->
<!doctype html>
<html lang="pt-br"> <!-- Idioma da página -->
  <head>
    <meta charset="utf-8" /> <!-- Codificação de caracteres usada -->
    <meta name="viewport" content="width=device-width" /> <!-- Ajuste do viewport para dispositivos móveis -->
    <title>Notadez - Listar componentes de nota</title> <!-- Título que aparece na aba do navegador -->

    <!-- Arquivo CSS externo do Bootstrap / Arquivo CSS personalizado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="comp_2.css" rel="stylesheet">
  </head>
  <body> <!-- Corpo do documento --> 
    <div class="card"> <!-- Container principal da página -->

      <button id="btn-sair" onclick="window.location.href='/dashboard/'"><</button> <!-- Botão de voltar para o dashboard -->

      <h1 id="title">Componentes de Nota</h1> <!-- Título da página -->
      
      <!-- Campo de entrada para código da disciplina -->
      <div class="field">
          <label for="componente_disc_id" class="componente_label">Insira o Código da Disciplina</label>
          <input id="componente_disc_id" class="componente_input" requiered placeholder="1, 2, ...">
      </div>
      <!-- Botão para buscar os componentes de nota -->
      <button type="button" class="btn col-2 mx-auto" onclick="preencherTabela()">Buscar</button>
      <br><br><br>
      <!-- Tabela para exibir os componentes de nota -->
      <table class="table"> <!-- Classe do Bootstrap para estilizar a tabela -->
          <thead> <!-- Cabeçalho da tabela -->
              <tr> <!-- Linha da tabela -->
                  <th>ID</th> <!-- Cabeçalho da coluna -->
                  <th>CÓDIGO DA DISCIPLINA</th>
                  <th>NOME</th>
                  <th>SIGLA</th>
                  <th>DESCRIÇÃO</th>
              </tr>
          </thead>
          <tbody> <!-- Corpo da tabela -->
              <!-- table rows, table headers, table datas através de código JS -->
          </tbody>
      </table>
    </div>

    <!-- Arquivos JavaScript externos do Bootstrap / Arquivo JavaScript personalizado -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="listar_comp.js"></script>
  </body>
</html>

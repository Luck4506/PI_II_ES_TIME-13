<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Notadez - Listar componentes de nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="comp_2.css" rel="stylesheet">
  </head>
  <body>
    <div class="card">

        <h1 id="title">Componentes de Nota</h1>
        
        <div class="field">
            <label for="componente_disc_id" class="componente_label">Insira o ID da Disciplina</label>
            <input id="componente_disc_id" class="componente_input" requiered placeholder="1, 2, ...">
        </div>
        <button type="button" class="btn" onclick="preencherTabela()">Buscar</button>
        <br><br><br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>CÓDIGO DA DISCIPLINA</th>
                    <th>NOME</th>
                    <th>SIGLA</th>
                    <th>DESCRIÇÃO</th>
                </tr>
            </thead>
            <tbody>
                <!-- table rows, table headers, table datas através de código JS -->
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="listar_comp.js"></script>
  </body>
</html>

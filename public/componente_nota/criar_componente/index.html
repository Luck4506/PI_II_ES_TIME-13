<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Notadez - Criação de componente de nota</title>
    <link href="comp.css" rel="stylesheet">
  </head>
  <body>
    <div class="card">

        <h1 id="title">Novo Componente de Nota</h1>

        <div class="field">
            <label for="componente_nome" class="componente_label">Nome</label>
            <input id="componente_nome" class="componente_input" requiered placeholder="Prova 1, Prova 2, ..."> <!-- default type é "text" -->
        </div>
        <div class="field">
            <label for="componente_sigla" class="componente_label">Sigla</label>
            <input id="componente_sigla" class="componente_input" requiered placeholder="P1, P2, ..."> <!-- default type é "text" -->
        </div>
        <div class="field">
            <label for="componente_descricao" class="componente_label">Descrição</label>
            <input id="componente_descricao" class="componente_input" requiered placeholder="Avaliação multipla-escolha, Dissertação, ..."> <!-- default type é "text" -->
        </div>
        <br><br>
        <button id="componente_button" onclick="">Criar</button>

    </div>
  </body>
</html>

<!-- Iniciando código HTML -->
<!doctype html>
<html lang="pt-br"> <!-- Idioma da página -->
  <head> <!-- Seção que contém informações sobre o documento -->
    <meta charset="utf-8" /> <!-- Codificação de caracteres usada -->
    <meta name="viewport" content="width=device-width" /> <!-- Ajuste do viewport para dispositivos móveis -->
    <title>Notadez - Criação de componente de nota</title> <!-- Título que aparece na aba do navegador -->
    <link href="comp.css" rel="stylesheet"> <!-- Arquivo CSS externo -->
  </head>
  <body> <!-- Corpo do documento -->
    <div class="card"> <!-- Container principal da página -->

      <button id="btn-sair" onclick="window.location.href='/dashboard/'"><</button> <!-- Botão de voltar para o dashboard -->

      <h1 id="title">Novo Componente de Nota</h1> <!-- Título da página -->

      <!-- Campos de entrada para os dados do componente de nota -->
      <div class="field">
          <label for="componente_cod_disciplina" class="componente_label">Código da Disciplina Correspondente</label>
          <input id="componente_cod_disciplina" class="componente_input" requiered placeholder="1, 2, ..."> <!-- default type é "text" -->
      </div>
      <div class="field">
          <label for="componente_nome" class="componente_label">Nome</label>
          <input id="componente_nome" class="componente_input" requiered placeholder="Prova 1, Prova 2, ...">
      </div>
      <div class="field">
          <label for="componente_sigla" class="componente_label">Sigla</label>
          <input id="componente_sigla" class="componente_input" requiered placeholder="P1, P2, ...">
      </div>
      <div class="field">
          <label for="componente_descricao" class="componente_label">Descrição</label>
          <input id="componente_descricao" class="componente_input" requiered placeholder="Avaliação multipla-escolha, Dissertação, ...">
      </div>
      <br><br>
      <!-- Botão para criar o componente de nota -->
      <button type="button" id="componente_button" onclick="criarComponente()">Criar</button>

    </div>
  <script src="criar_comp.js"></script> <!-- Arquivo JavaScript externo -->
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="comp_3.css">
    <title>NotaDez - Excluir componente de nota</title>
    </head>
    <body>
        <div class="card">

            <button id="btn-sair" onclick="window.location.href='/dashboard/'"><</button>

            <h1 id="title">Excluir Componente de Nota</h1>

            <p class="componente_subtitle">
            Digite o <strong>identificador (ID)</strong> do componente de nota que deseja remover.
            </p>

            <div class="componente_form">
                <label for="componente_nota_id" class="componente_label">ID do Componente</label>
                <input 
                    type="text" 
                    id="componente_nota_id"
                    class="componente_input" 
                    name="id"
                    required
                    placeholder="Ex.: 1, 3, 67"
                    autocomplete="off"
                />
                <small class="componente_help">
                    Este é o identificador único do componente de nota no sistema.
                </small>
            </div>

            <button type="button" class="componente_button" id="btn_excluir" onclick="excluirComponente()">
            Excluir
            </button>

        </div>
        <script src="excluir_comp.js"></script>
    </body>
</html>

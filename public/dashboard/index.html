<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Docente</title>
  <link rel="stylesheet" href="/dashboard/login.css">
</head>
<body>
  <div class="login-container">
    <h1 class="login-title">Painel do Docente</h1>
    <div class="formulario">
      <p style="font-size: 18px; color: #333; margin-bottom: 20px;">
        Bem-vindo ao sistema <strong>NotaDez</strong>!<br>
        Aqui você pode gerenciar suas disciplinas, alunos e notas.
      </p>
      <button class="login-button" onclick="window.location.href='/crud-instituicao'">Cadastrar Instituição</button>
      <button class="login-button" style="margin-top:15px; background: linear-gradient(135deg, #12d6d1 0%, #0462f7 100%);" onclick="window.location.href='/disciplinas'">Ver Disciplinas</button>
      <button class="login-button" style="margin-top:15px; background: linear-gradient(135deg, #d61bff 0%, #5a0ad8 100%);" onclick="window.location.href='/'">Sair</button>
    </div>
  </div>
</body>
</html>

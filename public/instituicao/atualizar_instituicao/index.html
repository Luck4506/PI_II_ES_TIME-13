<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="inst.css">
  <title>NotaDez - Cadastro Instituição</title>
  <script src="./atualizar_inst.js"></script>
</head>
<body>
  <div class="instituicao-container">
    <h1 class="instituicao-title">Atualize a sigla da instituicao aqui!</h1>

    <div class="instituicao-form">
      <label for="instituicao-nome" class="instituicao-label">Nome:</label>
      <input type="text" id="instituicao-nome" class="instituicao-input" name="nome" required placeholder="Nome da instituição">
    </div>

    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Sigla:</label>
      <input type="text" id="instituicao-sigla-antiga" class="instituicao-input" name="sigla" required placeholder="Sigla antiga da instituição">
    </div>

    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Sigla:</label>
      <input type="text" id="instituicao-sigla-nova" class="instituicao-input" name="sigla" required placeholder="Sigla nova da instituição">
    </div>

    <button type="button" class="instituicao-button" id="btn-cadastrar" onclick="atualizar()">Atualizar</button>
    <button class="instituicao-button" id="logout" style="margin-top:15px; background: linear-gradient(135deg, #d61bff 0%, #5a0ad8 100%);" onclick="window.location.href='/instituicao/'">Sair</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="inst.css">
  <title>NotaDez - Cadastro Instituição</title>
  <script src="./crud_inst.js"></script>
</head>
<body>
  <div class="instituicao-container">
    <h1 class="instituicao-title">Remova o docente da instituicao aqui!</h1>

    <div class="instituicao-form">
      <label for="instituicao-nome" class="instituicao-label">Id:</label>
      <input type="text" id="instituicao_id" class="instituicao-input" name="nome" required placeholder="Id da instituição">
    </div>

    <div class="instituicao-form">
      <label for="instituicao-sigla" class="instituicao-label">Id:</label>
      <input type="text" id="docente_id" class="instituicao-input" name="sigla" required placeholder="Id do docente">
    </div>

    <button type="button" class="instituicao-button" id="btn-cadastrar" onclick="remover()">Remover</button>
    <button class="instituicao-button" id="logout" style="margin-top:15px; background: linear-gradient(135deg, #d61bff 0%, #5a0ad8 100%);" onclick="window.location.href='/dashboard/'">Sair</button>
  </div>
</body>
</html>

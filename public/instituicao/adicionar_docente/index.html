<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="add_doce.css">
  <title>NotaDez - Cadastro Instituição</title>
  <script src="./add_doce.js"></script>
</head>
<body>
  <div class="instituicao-container">
    <h1 class="instituicao-title">Instituições!</h1>
    <div class="instituicao-container-1">
      
      <table border="1">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Sigla</th>
            </tr>
          </thead>
        <tbody id="tabela_instituicoes"></tbody>
      </table>
      <div class="instituicao-form">
        <label for="instituicao-id" class="instituicao-label">Institicao id:</label>
        <input type="text" id="instituicao-id" class="instituicao-input" name="id" required placeholder="Id da instituicao">
        <button type="button" class="instituicao-button" id="btn-cadastrar" onclick="entrar()">Entrar</button>
      </div>
      
    </div>
    <button class="instituicao-button" id="logout" style="margin-top:15px; background: linear-gradient(135deg, #d61bff 0%, #5a0ad8 100%);" onclick="window.location.href='/dashboard/'">Sair</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="disc_3.css">
    <title>NotaDez - Excluir disciplina</title>
    <script src="delete_disciplina.js"></script>
    </head>
    <body>
        <main class="disciplina-container">

            <h1 id="titulo-excluir" class="disciplina-title">Excluir Disciplina</h1>

            <p class="disciplina-subtitle">
            Digite o <strong>código (ID)</strong> da disciplina que deseja remover.
            </p>

            <div class="disciplina-form">
                <label for="disciplina-codigo" class="disciplina-label">Código da disciplina (ID):</label>
                <input 
                    type="text" 
                    id="disciplina-codigo" 
                    class="disciplina-input" 
                    name="codigo"
                    required
                    placeholder="Ex.: 1, 2, 55"
                    autocomplete="off"
                />
                <small id="ajuda-codigo" class="disciplina-help">
                    Este é o identificador único da disciplina no sistema.
                </small>
            </div>

            <button type="button" class="disciplina-button excluir" id="btn-excluir" onclick="excluirDisciplina()">
            Excluir disciplina
            </button>

        </main>
    </body>
</html>

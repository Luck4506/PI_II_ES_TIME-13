<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/mudar_senha/mudar_senha.css">
    <script src="/mudar_senha/mudar_senha.js" defer></script>
    <title>NotaDez - Recuperação de senha</title>

</head>

<body>
    <div class="recuperacao-container">
    <h1 class="recuperacao-title">Definir nova senha</h1>

    <span id="texto-recuperacao"><p>Digite sua nova senha para acessar sua conta NotaDez</p></span>

    <form>
    <div class="formulario">
    <label for="senha">Nova senha:</label>
    <input type="password" id="senha" class="senha-recuperacao" name="senha" required placeholder="Digite sua nova senha">

    <label for="confirmar-senha">Confirmar nova senha:</label>
    <input type="password" id="confirmar-senha" class="senha-recuperacao" name="confirmar-senha" required placeholder="Confirme sua nova senha">
    </div>

    <button type="submit" class="-button" id="btn-mudar-senha">Alterar senha</button>
    </form>

    <div id="resposta">
    <p id="mensagem-recuperacao"><span id="texto-recuperacao"></span></p>
    </div>
</body>
</html>
